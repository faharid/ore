stages:
  - validate
  - test
  - build
  - deploy

variables:
  TF_ROOT: terraform
  AWS_DEFAULT_REGION: us-east-1

.terraform_base:
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]
  before_script:
    - cd "${CI_PROJECT_DIR}/${TF_ROOT}"
    - terraform --version

validate:
  extends: .terraform_base
  stage: validate
  script:
    - terraform init -backend=false
    - terraform fmt -check -recursive
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  image: alpine:3.19
  script:
    - sh ci-cd/scripts/test.sh
  rules:
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - sh ci-cd/scripts/build.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: amazon/aws-cli:2.15.0
  script:
    - sh ci-cd/scripts/deploy.sh
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  needs:
    - build
