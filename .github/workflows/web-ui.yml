name: Web UI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            web/backend/package-lock.json
            web/frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: web/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web/frontend

      - name: Build frontend
        run: npm run build
        working-directory: web/frontend

      - name: Verify backend starts
        run: timeout 5 node src/index.js || test $? -eq 124
        working-directory: web/backend
        env:
          JWT_SECRET: ci-test-secret-min-32-chars-long
          USERS: '[{"username":"admin","password":"$2a$10$G9wPV9D.hJ5D5l.b6K8kFeJrYqN2aDNbCQT3r3V5x8V.QhD6K6k7i"}]'
          TERRAFORM_DIR: ${{ github.workspace }}/terraform

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t ore-backend:ci ./web/backend

      - name: Build frontend image
        run: docker build -t ore-frontend:ci ./web/frontend
